<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responsive Layout</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    /* Navigation Bar */
    nav {
      background-color: #333;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
    }

    nav ul {
      display: flex;
      gap: 1rem;
      list-style: none;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    /* Grid Container */
    .container {
      display: grid;
      grid-template-columns: 1fr 3fr;
      gap: 20px;
      padding: 20px;
    }

    aside {
      background-color: #f4f4f4;
      padding: 1rem;
    }

    main {
      background-color: #eaeaea;
      padding: 1rem;
    }

    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 1rem;
    }

    /* Responsive Layout */
    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }

      nav ul {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    @media (max-width: 480px) {
      nav {
        flex-direction: column;
        align-items: flex-start;
      }

      nav ul {
        gap: 0.5rem;
      }

      .container {
        padding: 10px;
      }

      aside,
      main {
        padding: 0.5rem;
      }
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">WEEK 4 ASSIGNMENT</div>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <div class="container">
    <aside>
      <h3>Sidebar</h3>
      <p>Useful links or info.</p>
    </aside>
    <main>
      <h1>Welcome</h1>
      <p>This is the main content area. Resize the browser to see the layout adjust for tablet and mobile screens.</p>
    </main>
  </div>

  <footer>
    &copy; 2025 KenTech. All rights reserved.
  </footer>

</body>
</html>
